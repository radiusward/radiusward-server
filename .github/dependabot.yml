# Keeps the workflows' actions and the Maven dependencies and plugins current. Third-party actions are pinned to
# commit SHAs (a tag can be moved to other code); Dependabot updates the SHA and its version comment together.
# Maven updates come weekly in one pull request for minor and patch versions; a major version gets its own, since
# it may need code changes. CI must pass before merging, as for any change.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"] # the workflows and the composite actions they share
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: maven
    directories: ["/", "/testing/embedded-consumer"] # the build, and the developer's project outside it
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
