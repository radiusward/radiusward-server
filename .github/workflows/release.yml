name: release

# main  -> ghcr.io/radiusward/radiusward-server:edge
# vX.Y.Z[-rc.N] -> :X.Y.Z[-rc.N] (+ :X.Y and :latest for final releases), SBOM and provenance attached,
#                  Helm chart oci://ghcr.io/radiusward/charts/radiusward:X.Y.Z[-rc.N],
#                  GitHub Release with radiusward.jar and radclient.jar (see docs/operations/release.md)
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/radiusward/radiusward-server

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # GitHub Release
      packages: write   # GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build, unit and end-to-end tests
        run: ./mvnw -B -ntp -Pe2e verify -Dradiusward.require.docker=true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Helm chart (oci://ghcr.io/radiusward/charts/radiusward, same version as the image)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/radiusward --version "$version" --app-version "$version"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "radiusward-$version.tgz" oci://ghcr.io/radiusward/charts
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag --generate-notes \
            --title "radiusward ${GITHUB_REF_NAME#v}" \
            distribution/target/radiusward.jar tools/radclient/target/radclient.jar
