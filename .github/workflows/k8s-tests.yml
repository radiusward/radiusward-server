name: k8s-tests

# The Helm chart on a kind cluster under load: leader killed, members and gateways rolled, a volume replaced
# (scripts/k8s-tests.sh, docs/operations/kubernetes.md). Too slow for every push: nightly, on demand and for release
# tags.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  k8s-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KIND: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install kind
        run: |
          curl --proto "=https" --tlsv1.2 -sSLo kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND/kind-linux-amd64"
          echo "$KIND_SHA256  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/
          kind version && kubectl version --client && helm version --short
      - name: Run the scenarios
        run: scripts/k8s-tests.sh
      - name: Upload pod logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-tests
          path: testing/k8s-tests/target/
