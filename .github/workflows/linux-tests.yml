name: linux-tests

# Fault-injection tests in containers (power loss with LazyFS, partitions, full disk, overload).
# Too slow for every push: nightly, on demand and for release tags.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      tests:
        description: 'Test classes to run, e.g. SystemdFailoverIT or PowerLossIT,PartitionIT (empty: all)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 240   # PostgresOutageIT 30 min, PurgeIT 60 min
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: FUSE for LazyFS
        run: |
          sudo modprobe fuse || true
          ls -l /dev/fuse
      - name: Build images and run the tests
        env:
          TESTS: ${{ inputs.tests }}
        run: scripts/linux-tests.sh ${TESTS:+"$TESTS"}
      - name: Upload test results (published by reports.yml)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-linux
          path: |
            testing/linux-tests/target/failsafe-reports/TEST-*.xml
            testing/linux-tests/target/allure-results/
          if-no-files-found: warn
      - name: Upload reports and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-tests
          path: |
            testing/linux-tests/target/failsafe-reports/
            testing/linux-tests/target/container-logs/
