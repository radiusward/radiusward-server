name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp -Preports verify -Dradiusward.require.docker=true
      - name: Benchmarks compile
        if: matrix.java == '25'
        run: ./mvnw -B -ntp -Pbench -pl testing/benchmarks -am package -DskipTests
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/*-reports/'
      - name: Upload integration test results (published by reports.yml)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-integration
          path: |
            **/target/failsafe-reports/TEST-*.xml
            **/target/allure-results/
          if-no-files-found: warn

  e2e:
    name: e2e (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: End-to-end tests (separate JVMs)
        run: ./mvnw -B -ntp -Pe2e,reports verify -Dradiusward.require.docker=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: '**/target/failsafe-reports/'
      - name: Upload end-to-end test results (published by reports.yml)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-e2e
          path: |
            testing/e2e-tests/target/failsafe-reports/TEST-*.xml
            testing/e2e-tests/target/allure-results/
          if-no-files-found: warn

  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl --proto "=https" --tlsv1.2 -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate (defaults, everything on; Kubernetes 1.31 and 1.35)
        run: |
          chart=deploy/helm/radiusward
          for values in "" "-f $chart/ci/all-on-values.yaml"; do
            helm lint $chart $values
            for k8s in 1.31.0 1.35.0; do
              helm template radiusward $chart $values | kubeconform -strict -summary -kubernetes-version $k8s \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            done
          done

  coverage:
    name: coverage (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs the history to tell new code from old
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and integration tests with coverage, module floors
        env:
          # SonarQube Cloud analysis when the token is there (not for pull requests from forks)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then SONAR=sonar:sonar; else SONAR=; fi
          ./mvnw -B -ntp -Pcoverage verify $SONAR -Dradiusward.require.docker=true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: testing/coverage/target/site/jacoco-aggregate/
