name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: External RADIUS server for the interop tests
        timeout-minutes: 10
        # Ubuntu's server and client tools; the package starts a service on 1812/1813, which the tests do not need.
        # The .deb files come from the prebuilt interop-debs image (docs/testing/strategy.md#test-images), so no
        # package mirror is needed; only when it is not published (a changed Dockerfile) or does not fit the runner
        # (an installed package newer than the image's) apt downloads them.
        run: |
          image=ghcr.io/radiusward/radiusward-test-images:$(scripts/test-images.sh tag interop-debs)
          from_image() {
            # /tmp/debs is a local apt repository and, as the archive cache, holds every file: nothing is downloaded
            docker pull -q "$image" >/dev/null || return 1
            docker create --name interop-debs "$image" none >/dev/null
            docker cp interop-debs:/debs /tmp/debs
            docker rm interop-debs >/dev/null
            echo "deb [trusted=yes] file:/tmp/debs ./" | sudo tee /etc/apt/sources.list.d/interop-debs.list >/dev/null
            sudo apt-get update -qq -o Dir::Etc::sourcelist=sources.list.d/interop-debs.list -o Dir::Etc::sourceparts=- &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y -o Dir::Cache::archives=/tmp/debs \
                freeradius freeradius-utils >/dev/null
            local status=$?
            sudo rm -f /etc/apt/sources.list.d/interop-debs.list
            return $status
          }
          if ! from_image; then
            echo "$image is not published or does not fit; installing from the package mirror"
            # the runners' Azure mirror sometimes cannot be reached; apt falls back to the main archive, then kernel.org's
            printf "http://archive.ubuntu.com/ubuntu/\tpriority:2\nhttp://mirrors.edge.kernel.org/ubuntu/\tpriority:3\n" | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            for attempt in 1 2 3 4; do
              if sudo apt-get -o Acquire::Retries=5 update -qq && \
                 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -qq -y freeradius freeradius-utils >/dev/null; then
                break
              fi
              [ "$attempt" = 4 ] && exit 1
              echo "package install failed (attempt $attempt), retrying in 20 s"; sleep 20
            done
          fi
          sudo systemctl disable --now freeradius
          /usr/sbin/freeradius -v | head -1
      - name: Build and test
        run: ./mvnw -B -ntp -Preports -Pinterop verify -Dradiusward.require.docker=true
      - name: Benchmarks compile
        if: matrix.java == '25'
        run: ./mvnw -B -ntp -Pbench -pl testing/benchmarks -am package -DskipTests
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/*-reports/'
      - name: Upload integration test results (published by reports.yml)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-integration
          path: |
            **/target/failsafe-reports/TEST-*.xml
            **/target/allure-results/
          if-no-files-found: warn

  e2e:
    name: e2e (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: End-to-end tests (separate JVMs)
        run: ./mvnw -B -ntp -Pe2e,reports verify -Dradiusward.require.docker=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: '**/target/failsafe-reports/'
      - name: Upload end-to-end test results (published by reports.yml)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-e2e
          path: |
            testing/e2e-tests/target/failsafe-reports/TEST-*.xml
            testing/e2e-tests/target/allure-results/
          if-no-files-found: warn

  pr-report:
    # pull requests: the integration and end-to-end reports as an artifact (never published, ADR 0064) and an Allure
    # summary comment with new and flaky tests on the pull request
    name: test report (pull request)
    if: github.event_name == 'pull_request' && !cancelled()
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write   # the summary comment
      checks: write          # the quality-gate check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - name: Build the reports
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha }}
          REPORT_BRANCH: ${{ github.head_ref }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/test-reports.sh results test-reports
      - uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: test-reports
      - name: Summary on the pull request
        # forks get a read-only token; their reports stay in the artifact
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: allure-framework/allure-action@4729c7af3b9b1bf9305d8ace73db4028822fe78b # v0.12.0
        with:
          report-directory: test-reports
          sections: |
            new
            flaky

  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl --proto "=https" --tlsv1.2 -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate (defaults, everything on; Kubernetes 1.31 and 1.35)
        run: |
          chart=deploy/helm/radiusward
          for values in "" "-f $chart/ci/all-on-values.yaml"; do
            helm lint $chart $values
            for k8s in 1.31.0 1.35.0; do
              helm template radiusward $chart $values | kubeconform -strict -summary -kubernetes-version $k8s \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            done
          done

  aws-templates:
    # the example AWS templates (docs/operations/aws-ecs.md) are linted only, never deployed by the project
    name: aws templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: CloudFormation (cfn-lint)
        run: |
          pip install --quiet cfn-lint==1.60.0
          cfn-lint deploy/aws/cloudformation/radiusward-ecs.yaml
      - name: Terraform (tofu fmt and validate)
        working-directory: deploy/aws/terraform
        run: |
          tofu fmt -check
          tofu init -backend=false -input=false
          tofu validate

  coverage:
    name: coverage (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs the history to tell new code from old
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and integration tests with coverage, module floors
        env:
          # SonarQube Cloud analysis when the token is there (not for pull requests from forks)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then SONAR=sonar:sonar; else SONAR=; fi
          ./mvnw -B -ntp -Pcoverage verify $SONAR -Dradiusward.require.docker=true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: testing/coverage/target/site/jacoco-aggregate/
