name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify -Dradiusward.require.docker=true
      - name: Benchmarks compile
        if: matrix.java == '25'
        run: ./mvnw -B -ntp -Pbench -pl testing/benchmarks -am package -DskipTests
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/*-reports/'

  e2e:
    name: e2e (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: End-to-end tests (separate JVMs)
        run: ./mvnw -B -ntp -Pe2e verify -Dradiusward.require.docker=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: '**/target/failsafe-reports/'

  coverage:
    name: coverage (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs the history to tell new code from old
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and integration tests with coverage, module floors
        env:
          # SonarQube Cloud analysis when the token is there (not for pull requests from forks)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then SONAR=sonar:sonar; else SONAR=; fi
          ./mvnw -B -ntp -Pcoverage verify $SONAR -Dradiusward.require.docker=true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: testing/coverage/target/site/jacoco-aggregate/
