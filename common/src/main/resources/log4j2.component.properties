# radiusward logging (ADR 0013): every logger is async (LMAX Disruptor ring buffer) and logging never
# blocks the calling thread. System properties override these values.
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
log4j2.asyncQueueFullPolicy=io.radiusward.common.logging.NonBlockingQueueFullPolicy
log4j2.asyncLoggerRingBufferSize=8192
log4j2.asyncLoggerWaitStrategy=Timeout
# garbage-free mode; SystemMillisClock avoids allocating a java.time.Instant per event
log4j2.clock=SystemMillisClock
log4j2.enableThreadlocals=true
log4j2.enableDirectEncoders=true
log4j2.isWebapp=false
