# Prometheus for the compose stack (profile "monitoring"); addresses as in deploy/compose/compose.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: radiusward-member
    static_configs:
      - targets: ["172.28.0.10:9090", "172.28.0.11:9090", "172.28.0.12:9090"]
  - job_name: radiusward-gateway
    static_configs:
      - targets: ["172.28.0.20:9090", "172.28.0.21:9090"]
  - job_name: radiusward-backup   # the backup profile; down while it is not started
    static_configs:
      - targets: ["172.28.0.50:9090"]
