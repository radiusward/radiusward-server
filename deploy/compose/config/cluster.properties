# Cluster members in compose. Per-node settings (cluster.node.id) come from the environment.
# Static IPs, not container names: Aeron re-resolves endpoints of a dead member, and a lookup of a stopped
# container's name can block the media driver for seconds (measured: a 5 s election). See docs/operations/docker.md.
cluster.members=172.28.0.10,172.28.0.11,172.28.0.12
cluster.base.port=9000
cluster.leader.heartbeat.timeout=1500ms
cluster.election.timeout=500ms
cluster.session.timeout=10s
archive.file.sync.level=2
snapshot.interval=1h
management.http.port=9090
