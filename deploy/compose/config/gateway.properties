# Gateways in compose. gateway.id and gateway.egress.host come from the environment.
cluster.members=172.28.0.10,172.28.0.11,172.28.0.12
cluster.base.port=9000
gateway.listen.host=0.0.0.0
gateway.listen.port=1813
management.http.port=9090
# Authentication with a demo users file (deploy/compose/config/users): PAP, CHAP and MS-CHAPv2.
gateway.auth.enabled=true
gateway.auth.port=1812
auth.stores=demo
auth.store.demo.type=file
auth.store.demo.path=/etc/radiusward/users
auth.store.demo.chap=true
auth.store.demo.mschap=true
