#
# radiusward: 3 cluster members + 2 gateways (small profile, fsync on).
#
#   docker compose -f deploy/compose/compose.yaml up -d
#   docker compose -f deploy/compose/compose.yaml run --rm tools acct --server gateway-a:1813 \
#          --secret "$NAS_SECRET" --status start --session-id s1
#   docker compose -f deploy/compose/compose.yaml run --rm tools auth --server gateway-a:1812 \
#          --secret "$NAS_SECRET" --user alice --password secret
#
# Test clients run inside this network: on macOS Docker rewrites the source address of UDP traffic through
# published ports, so a host-side client would not match any NAS entry (see docs/operations/docker.md).
name: radiusward

x-node: &node
  image: ${RADIUSWARD_IMAGE:-radiusward:dev}
  command: ["cluster-node", "--config", "/etc/radiusward/cluster.properties"]
  shm_size: 512m
  mem_limit: 1g
  cpus: 1.0
  restart: unless-stopped
  environment: &node-env
    RADIUSWARD_PROFILE: ${RADIUSWARD_PROFILE:-small}
    PG_PASSWORD: ${PG_PASSWORD:-radiusward}
  healthcheck:
    test: ["CMD", "radiusward", "probe", "http://127.0.0.1:9090/ready"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 5s

x-gateway: &gateway
  image: ${RADIUSWARD_IMAGE:-radiusward:dev}
  command: ["gateway", "--config", "/etc/radiusward/gateway.properties", "--config", "/etc/radiusward/nas-clients.properties"]
  shm_size: 128m
  mem_limit: 384m
  cpus: 1.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "radiusward", "probe", "http://127.0.0.1:9090/ready"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 5s
  depends_on:
    node-0: {condition: service_started}
    node-1: {condition: service_started}
    node-2: {condition: service_started}

services:
  node-0:
    <<: *node
    hostname: node-0
    environment: {<<: *node-env, RADIUSWARD_CLUSTER_NODE_ID: "0"}
    volumes: ["node-0:/var/lib/radiusward", "./config/cluster.properties:/etc/radiusward/cluster.properties:ro"]
    networks: {radius: {ipv4_address: 172.28.0.10}}
    ports: ["127.0.0.1:9090:9090"]
  node-1:
    <<: *node
    hostname: node-1
    environment: {<<: *node-env, RADIUSWARD_CLUSTER_NODE_ID: "1"}
    volumes: ["node-1:/var/lib/radiusward", "./config/cluster.properties:/etc/radiusward/cluster.properties:ro"]
    networks: {radius: {ipv4_address: 172.28.0.11}}
    ports: ["127.0.0.1:9091:9090"]
  node-2:
    <<: *node
    hostname: node-2
    environment: {<<: *node-env, RADIUSWARD_CLUSTER_NODE_ID: "2"}
    volumes: ["node-2:/var/lib/radiusward", "./config/cluster.properties:/etc/radiusward/cluster.properties:ro"]
    networks: {radius: {ipv4_address: 172.28.0.12}}
    ports: ["127.0.0.1:9092:9090"]

  gateway-a:
    <<: *gateway
    hostname: gateway-a
    environment:
      RADIUSWARD_PROFILE: ${RADIUSWARD_PROFILE:-small}
      RADIUSWARD_GATEWAY_ID: "1"
      RADIUSWARD_GATEWAY_EGRESS_HOST: 172.28.0.20  # an IP, so the cluster never resolves a dead gateway's name
      NAS_SECRET: ${NAS_SECRET:-testing123}
    volumes: ["./config/gateway.properties:/etc/radiusward/gateway.properties:ro", "./config/nas-clients.properties:/etc/radiusward/nas-clients.properties:ro", "./config/users:/etc/radiusward/users:ro"]
    networks: {radius: {ipv4_address: 172.28.0.20}}
    ports: ["1812:1812/udp", "1813:1813/udp", "127.0.0.1:9190:9090"]
  gateway-b:
    <<: *gateway
    hostname: gateway-b
    environment:
      RADIUSWARD_PROFILE: ${RADIUSWARD_PROFILE:-small}
      RADIUSWARD_GATEWAY_ID: "2"
      RADIUSWARD_GATEWAY_EGRESS_HOST: 172.28.0.21
      NAS_SECRET: ${NAS_SECRET:-testing123}
    volumes: ["./config/gateway.properties:/etc/radiusward/gateway.properties:ro", "./config/nas-clients.properties:/etc/radiusward/nas-clients.properties:ro", "./config/users:/etc/radiusward/users:ro"]
    networks: {radius: {ipv4_address: 172.28.0.21}}
    ports: ["1815:1812/udp", "1814:1813/udp", "127.0.0.1:9191:9090"]

  # the exporter's PostgreSQL (radiusward_export_* metrics; psql: docker compose exec postgres psql -U radiusward radius)
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radiusward
      POSTGRES_PASSWORD: ${PG_PASSWORD:-radiusward}
    volumes: ["postgres:/var/lib/postgresql/data", "./sql:/sql:ro"]
    networks: {radius: {ipv4_address: 172.28.0.40}}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "radiusward", "-d", "radius"]
      interval: 5s
      timeout: 4s
      retries: 12

  # docker compose --profile backup up -d   → a continuous backup outside the cluster (docs/operations/backup.md)
  backup:
    image: ${RADIUSWARD_IMAGE:-radiusward:dev}
    profiles: ["backup"]
    command: ["cluster-backup", "--config", "/etc/radiusward/backup.properties"]
    shm_size: 256m
    mem_limit: 768m
    restart: unless-stopped
    volumes: ["backup:/var/lib/radiusward", "./config/backup.properties:/etc/radiusward/backup.properties:ro"]
    networks: {radius: {ipv4_address: 172.28.0.50}}
    ports: ["127.0.0.1:9193:9090"]
    healthcheck:
      test: ["CMD", "radiusward", "probe", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 4s
      retries: 6

  # docker compose run --rm tools <radclient arguments>
  tools:
    image: ${RADIUSWARD_IMAGE:-radiusward:dev}
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/radiusward", "radclient"]
    networks: [radius]

  # docker compose --profile monitoring up -d   → Prometheus 127.0.0.1:9095, Grafana 127.0.0.1:3000
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [radius]
    ports: ["127.0.0.1:9095:9090"]
  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [radius]
    ports: ["127.0.0.1:3000:3000"]

networks:
  radius:
    ipam:
      config: [{subnet: 172.28.0.0/24}]

volumes:
  backup:
  postgres:
  node-0:
  node-1:
  node-2:
