{{- if ne (int .Values.node.replicas) 3 }}
{{- fail "node.replicas must be 3: the cluster has a static membership of three members (ADR 0062)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radiusward.fullname" . }}-node
  labels: {{- include "radiusward.labels" . | nindent 4 }}
data:
  cluster.properties: |
    # generated by the radiusward chart; cluster.node.id comes from the pod index
    cluster.members={{ include "radiusward.members" . }}
    cluster.base.port={{ .Values.node.basePort }}
    cluster.leader.heartbeat.timeout={{ .Values.node.leaderHeartbeatTimeout }}
    cluster.election.timeout={{ .Values.node.electionTimeout }}
    archive.file.sync.level=2
    management.http.port=9090
    {{- with .Values.node.export.postgres }}
    {{- if .enabled }}
    export.sinks=pg
    sink.pg.type=postgres
    sink.pg.url={{ required "node.export.postgres.url is required" .url }}
    sink.pg.user={{ .user }}
    sink.pg.password=${env:RW_PG_PASSWORD:-}
    sink.pg.mode={{ .mode }}
    sink.pg.radacct.view={{ .radacctView }}
    {{- else }}
    export.sinks=
    {{- end }}
    {{- end }}
    {{- range $k, $v := .Values.node.config }}
    {{ $k }}={{ $v }}
    {{- end }}
