Secrets are not in here: NAS secrets and store passwords come from the environment (${env:...}), users files are
mounted from Secrets.
*/ -}}
{{- $g := .Values.gateway -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radiusward.fullname" . }}-gateway
  labels: {{- include "radiusward.labels" . | nindent 4 }}
data:
  gateway.properties: |
    # generated by the radiusward chart; gateway.id comes from the pod index, gateway.egress.host from the pod IP
    cluster.members={{ include "radiusward.members" . }}
    cluster.base.port={{ .Values.node.basePort }}
    gateway.listen.host=0.0.0.0
    gateway.listen.port={{ $g.ports.acct }}
    management.http.port=9090
    {{- range $i, $n := $g.nas }}
    nas.{{ $n.name }}.address={{ required "gateway.nas[].address is required" $n.address }}
    nas.{{ $n.name }}.secret=${env:RW_NAS_{{ $i }}}
    {{- with $n.vendor }}
    nas.{{ $n.name }}.vendor={{ . }}
    {{- end }}
    {{- with $n.id }}
    nas.{{ $n.name }}.id={{ . }}
    {{- end }}
    {{- end }}
    {{- if $g.auth.enabled }}
    {{- if not $g.auth.stores }}{{ fail "gateway.auth.enabled needs at least one gateway.auth.stores entry" }}{{ end }}
    gateway.auth.enabled=true
    gateway.auth.port={{ $g.ports.auth }}
    {{- if $g.auth.stores }}
    {{- $names := list }}
    {{- range $g.auth.stores }}{{ $names = append $names .name }}{{ end }}
    auth.stores={{ join "," $names }}
    {{- end }}
    {{- range $s := $g.auth.stores }}
    auth.store.{{ $s.name }}.type={{ $s.type }}
    {{- if eq $s.type "file" }}
    auth.store.{{ $s.name }}.path=/etc/radiusward/stores/{{ $s.name }}/users
    {{- end }}
    {{- if eq $s.type "sql" }}
    auth.store.{{ $s.name }}.url={{ required "a sql store needs url" $s.url }}
    auth.store.{{ $s.name }}.user={{ $s.user | default "" }}
    auth.store.{{ $s.name }}.password=${env:RW_STORE_{{ $s.name | upper | replace "-" "_" }}_PASSWORD:-}
    {{- end }}
    {{- if $s.chap }}
    auth.store.{{ $s.name }}.chap=true
    {{- end }}
    {{- if $s.mschap }}
    auth.store.{{ $s.name }}.mschap=true
    {{- end }}
    {{- end }}
    {{- with $g.auth.eap.methods }}
    auth.eap.methods={{ join ", " . }}
    {{- end }}
    {{- if $g.auth.eap.tls.existingSecret }}
    auth.eap.tls.certificate=/etc/radiusward/tls/eap/tls.crt
    auth.eap.tls.key=/etc/radiusward/tls/eap/tls.key
    auth.eap.tls.ca=/etc/radiusward/tls/eap/ca.crt
    {{- end }}
    {{- end }}
    {{- if $g.coa.enabled }}
    coa.enabled=true
    {{- end }}
    {{- if $g.radsec.enabled }}
    radsec.enabled=true
    radsec.port={{ $g.radsec.port }}
    radsec.certificate=/etc/radiusward/tls/radsec/tls.crt
    radsec.key=/etc/radiusward/tls/radsec/tls.key
    radsec.ca=/etc/radiusward/tls/radsec/ca.crt
    {{- end }}
    {{- range $k, $v := $g.config }}
    {{ $k }}={{ $v }}
    {{- end }}
