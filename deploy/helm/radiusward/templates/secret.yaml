{{- /*
Copyright 2026 The radiusward Authors
SPDX-License-Identifier: Apache-2.0
Passwords and users files given in values; anything with existingSecret is read from that Secret instead.
*/ -}}
{{- $data := dict -}}
{{- range $i, $n := .Values.gateway.nas -}}
{{- if and $n.secret (not $n.existingSecret) -}}
{{- $_ := set $data (printf "nas-%d" $i) $n.secret -}}
{{- end -}}
{{- end -}}
{{- range .Values.gateway.auth.stores -}}
{{- if and .users (not .existingSecret) -}}
{{- $_ := set $data (printf "store-%s-users" .name) .users -}}
{{- end -}}
{{- if and .password (not .existingSecret) -}}
{{- $_ := set $data (printf "store-%s-password" .name) .password -}}
{{- end -}}
{{- end -}}
{{- with .Values.node.export.postgres -}}
{{- if and .enabled .password (not .existingSecret) -}}
{{- $_ := set $data "postgres-password" .password -}}
{{- end -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "radiusward.secretName" . }}
  labels: {{- include "radiusward.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
