{{- /*
Copyright 2026 The radiusward Authors
SPDX-License-Identifier: Apache-2.0
The cluster backup outside the cluster (ADR 0065): the latest snapshot and the live log on a volume of its own, the
source of cluster-restore after a lost quorum (docs/operations/backup.md).
*/ -}}
{{- if .Values.backup.enabled }}
{{- $fn := include "radiusward.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-backup
  labels: {{- include "radiusward.labels" . | nindent 4 }}
data:
  backup.properties: |
    # generated by the radiusward chart; backup.host is the pod's address
    cluster.members={{ include "radiusward.members" . }}
    cluster.base.port={{ .Values.node.basePort }}
    backup.port={{ .Values.backup.port }}
    backup.source={{ .Values.backup.source }}
    backup.interval={{ .Values.backup.interval }}
    management.http.port=9090
    {{- with index .Values.node.config "archive.segment.length" }}
    archive.segment.length={{ . }}
    {{- end }}
{{- end }}
