# Example Prometheus alert rules for radiusward (docs/operations/monitoring.md). Thresholds assume the default
# lag policy (maxLag 4h) and cluster.disk.min.free 1 GiB; adjust them to your settings.
groups:
  - name: radiusward
    rules:
      - alert: RadiuswardNoLeader
        expr: max(radiusward_cluster_leader) == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: No cluster member is leader
          description: Accounting is not acknowledged while there is no leader; NAS devices retransmit and buffer.

      - alert: RadiuswardFrequentElections
        expr: increase(max(radiusward_cluster_leadership_terms_total)[15m:]) > 3
        labels: {severity: warning}
        annotations:
          summary: More than 3 leader elections in 15 minutes
          description: Check the network between members, CPU starvation and GC pauses.

      - alert: RadiuswardMemberDown
        expr: up{job="radiusward-member"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Cluster member {{ $labels.instance }} does not answer"
          description: Two of three members keep accounting going; with a member down the log is not purged below its position.

      - alert: RadiuswardExportLagWarning
        expr: max by (sink) (radiusward_export_lag_seconds) > 2 * 3600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Sink {{ $labels.sink }} is more than 2 h behind"
          description: At maxLag (default 4 h) a required sink stops new ACKs (block); an optional one is detached.

      - alert: RadiuswardExportBlocking
        expr: increase(sum(radiusward_accounting_export_lag_rejections_total)[5m:]) > 0
        labels: {severity: critical}
        annotations:
          summary: Accounting is rejected because a required sink is over its maxLag
          description: Fix the sink (database down?); ACKs resume as soon as it is below maxLag again.

      - alert: RadiuswardSinkDetached
        expr: max by (sink) (radiusward_export_detached) == 1
        labels: {severity: warning}
        annotations:
          summary: "Optional sink {{ $labels.sink }} was detached"
          description: It no longer holds the log; data purged meanwhile has to be resynced by hand (radiusward admin resync).

      - alert: RadiuswardSinkErrors
        expr: increase(sum by (sink) (radiusward_export_errors_total)[10m:]) > 5
        labels: {severity: warning}
        annotations:
          summary: "Sink {{ $labels.sink }} keeps failing"
          description: See lastError on /state of the exporting member.

      - alert: RadiuswardDiskLow
        expr: radiusward_disk_free_bytes < radiusward_disk_min_free_bytes
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Member {{ $labels.member }} is low on disk space"
          description: A full disk stops the member. Check the log purge (radiusward_log_purge_floor_bytes) and sink lag.

      - alert: RadiuswardServerDropping
        expr: sum by (server) (rate(radiusward_server_packets_total{result=~"pending_full|ring_full"}[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "RADIUS server {{ $labels.server }} drops requests (overload)"
          description: NAS devices retransmit; add RADIUS servers or capacity.

      - alert: RadiuswardServerDisconnected
        expr: radiusward_server_cluster_connected == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "RADIUS server {{ $labels.server }} is not connected to the cluster"

      # authentication (server.auth.enabled)
      - alert: RadiuswardRejectRatioHigh
        expr: |
          sum by (server) (rate(radiusward_server_access_requests_total{result="rejected"}[10m]))
            / (sum by (server) (rate(radiusward_server_access_requests_total{result=~"accepted|rejected"}[10m])) > 0.1)
            > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than half of the Access-Requests on RADIUS server {{ $labels.server }} are rejected"
          description: Look at radiusward_server_access_rejects_total by cause; a store that lost its users or a NAS with a wrong secret are common reasons.

      - alert: RadiuswardIdentityStoreUnavailable
        expr: sum by (server, store) (rate(radiusward_server_store_lookups_total{result="unavailable"}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Identity store {{ $labels.store }} does not answer RADIUS server {{ $labels.server }}"
          description: Users it might know are not answered (never rejected on its behalf); the NAS retransmits.

      - alert: RadiuswardAuthWorkersSaturated
        expr: sum by (server) (rate(radiusward_server_access_requests_total{result="busy"}[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "RADIUS server {{ $labels.server }} has no free slot for Access-Requests"
          description: Raise server.auth.workers or server.auth.pending, add RADIUS servers, or look at slow stores (radiusward_server_store_lookup_seconds).

      - alert: RadiuswardHomeServerDown
        expr: min by (server, home) (radiusward_server_proxy_home_alive) == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Home server {{ $labels.home }} is marked dead on RADIUS server {{ $labels.server }}"
          description: Proxied realms fail over to other home servers of their pool, if there are any.

      - alert: RadiuswardCertificateExpiring
        expr: min by (server, use) (radiusward_tls_certificate_expiry_timestamp_seconds) - time() < 14 * 86400
        labels: {severity: warning}
        annotations:
          summary: "The {{ $labels.use }} server certificate of RADIUS server {{ $labels.server }} expires within 14 days"
          description: Replace the files; RADIUS servers reload them without a restart.

      - alert: RadiuswardSimSequenceNumbersUnavailable
        expr: sum by (server) (rate(radiusward_server_sim_sqn_requests_total{outcome=~"capacity|unsupported"}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "EAP-AKA on RADIUS server {{ $labels.server }} gets no sequence numbers from the cluster"
          description: "capacity: raise service.sim.subscribers.max; unsupported: state version 8 is not active yet (a member runs an older release)."

      # cluster backup (ADR 0065)
      - alert: RadiuswardBackupNotBackingUp
        expr: max(radiusward_backup_state{state="backing_up"}) == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: The cluster backup is not recording the live log
          description: Look at the backup's log and /ready; until it records again a lost quorum can only be restored to its last position.

      - alert: RadiuswardBackupBehind
        expr: max(radiusward_cluster_log_position_bytes) - max(radiusward_backup_live_log_position_bytes) > 64 * 1024 * 1024
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: The cluster backup is more than 64 MiB of log behind the members
          description: A restore after a lost quorum would lose what the backup has not recorded; check the network between the backup and the members.

      - alert: RadiuswardBackupSnapshotOld
        expr: time() - max(radiusward_backup_snapshot_timestamp_seconds) > 3 * 3600
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: The newest snapshot in the cluster backup is older than 3 hours
          description: The members take one every snapshot.interval (1 h); the backup fetches it every backup.interval. A restore replays the log since then.
