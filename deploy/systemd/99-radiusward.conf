# /etc/sysctl.d/99-radiusward.conf: room for Aeron's UDP socket buffers between members and gateways
# (docs/operations/bare-metal.md). Apply with: sysctl --system
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
