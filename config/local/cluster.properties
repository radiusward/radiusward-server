# Shared settings of the local 3-node cluster (Phase 1, no Docker). Per-node files set cluster.node.id.
profile=small
cluster.members=localhost,localhost,localhost
cluster.base.port=9000
cluster.data.dir=.local/data
# fail over quickly on one machine (Aeron's default is 10s)
cluster.leader.heartbeat.timeout=3s
cluster.session.timeout=10s
archive.file.sync.level=2
snapshot.interval=1h
service.sweep.interval=60s
service.tombstone=1h
service.idle.timeout=2h
service.exact.key.window=15m
management.http.host=127.0.0.1
